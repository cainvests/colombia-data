<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Calendario económico · CA Invests</title>
<style>
html,body{margin:0;height:100%;background:#12151a;color-scheme:dark;overflow:hidden}
.tradingview-widget-container,.tradingview-widget-container__widget{height:100%;width:100%}
</style></head><body>
<!-- Página auxiliar: la Terminal la muestra dentro de un marco. Solo acepta parámetros validados. -->
<div class="tradingview-widget-container"><div class="tradingview-widget-container__widget"></div></div>
<script>
(function () {
  var q = new URLSearchParams(location.search);
  var ok = /^[a-z]{2}$/;
  var c = (q.get("c") || "").split(",").filter(function (x) { return ok.test(x); }).slice(0, 80).join(",");
  var imp = q.get("imp") || "-1,0,1";
  if (!/^(-1,0,1|0,1|1)$/.test(imp)) imp = "-1,0,1";
  var lang = q.get("lang") === "en" ? "en" : "es";
  var cfg = { colorTheme: "dark", isTransparent: true, locale: lang, importanceFilter: imp, width: "100%", height: "100%" };
  if (c) cfg.countryFilter = c;
  var s = document.createElement("script");
  s.type = "text/javascript"; s.async = true;
  s.src = "https://s3.tradingview.com/external-embedding/embed-widget-events.js";
  s.text = JSON.stringify(cfg);
  document.querySelector(".tradingview-widget-container").appendChild(s);
})();
</script>
</body></html>
