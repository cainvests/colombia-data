<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gráfico · CA Invests</title>
<style>
html,body{margin:0;height:100%;background:#12151a;overflow:hidden}
.tradingview-widget-container,.tradingview-widget-container__widget{height:100%;width:100%}
</style></head><body>
<!-- Página auxiliar: la Terminal la muestra dentro de un marco. Solo acepta parámetros validados. -->
<div class="tradingview-widget-container"><div class="tradingview-widget-container__widget"></div></div>
<script>
(function () {
  var q = new URLSearchParams(location.search);
  var sym = (q.get("s") || "").trim();
  if (!/^[A-Za-z0-9:._!\-\/]{1,40}$/.test(sym)) sym = "";
  if (!sym) { document.body.innerHTML = '<p style="font:13px system-ui;color:#8b93a1;padding:14px">Símbolo no válido.</p>'; return; }
  var lang = q.get("lang") === "en" ? "en" : "es";
  var cfg = { autosize: true, symbol: sym, interval: "D", timezone: "America/Bogota", theme: "dark", style: "1", locale: lang,
              backgroundColor: "#12151a", gridColor: "rgba(255,255,255,0.05)", allow_symbol_change: false, save_image: false,
              hide_side_toolbar: true, support_host: "https://www.tradingview.com" };
  var s = document.createElement("script");
  s.type = "text/javascript"; s.async = true;
  s.src = "https://s3.tradingview.com/external-embedding/embed-widget-advanced-chart.js";
  s.text = JSON.stringify(cfg);
  document.querySelector(".tradingview-widget-container").appendChild(s);
})();
</script>
</body></html>
