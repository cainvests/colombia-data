<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Noticias del mercado · CA Invests</title>
<style>
html,body{margin:0;height:100%;background:#12151a;overflow:hidden}
.tradingview-widget-container,.tradingview-widget-container__widget{height:100%;width:100%}
</style></head><body>
<!-- Página auxiliar: la Terminal la muestra dentro de un marco. Solo acepta parámetros validados. -->
<div class="tradingview-widget-container"><div class="tradingview-widget-container__widget"></div></div>
<script>
(function () {
  var q = new URLSearchParams(location.search);
  var MK = { all: 1, stock: 1, crypto: 1, forex: 1, index: 1, futures: 1, bond: 1, economic: 1 };
  var m = q.get("m"); if (!MK[m]) m = "all";
  var sym = (q.get("s") || "").trim();
  if (!/^[A-Za-z0-9:._!\-\/]{1,40}$/.test(sym)) sym = "";
  var lang = q.get("lang") === "en" ? "en" : "es";
  var cfg = { displayMode: "regular", colorTheme: "dark", isTransparent: true, locale: lang, width: "100%", height: "100%" };
  if (sym) { cfg.feedMode = "symbol"; cfg.symbol = sym; }
  else if (m === "all") { cfg.feedMode = "all_symbols"; }
  else { cfg.feedMode = "market"; cfg.market = m; }
  var s = document.createElement("script");
  s.type = "text/javascript"; s.async = true;
  s.src = "https://s3.tradingview.com/external-embedding/embed-widget-timeline.js";
  s.text = JSON.stringify(cfg);
  document.querySelector(".tradingview-widget-container").appendChild(s);
})();
</script>
</body></html>
